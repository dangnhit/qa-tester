name: Release

# Tag-driven, never push-driven. A publish is an irreversible act against a public
# registry, so the trigger is an annotated tag a human created deliberately, and the
# whole quality gate runs AGAIN here rather than trusting that CI was green on the
# commit the tag happens to point at -- a tag can be moved onto any commit, including
# one CI never saw.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    name: Full gate on the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The tag and package.json must agree BEFORE anything is built. `npm publish`
      # reads package.json and ignores the tag entirely, so a v1.0.1 tag on a 1.0.0
      # package.json would publish 1.0.0 a second time (a hard registry refusal, if
      # you are lucky) or publish the wrong version under the right-looking tag.
      - name: Tag matches the version being published
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi
      - run: npm run generate:types
      - run: npm run check:generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run scan:secrets
      - run: npm run scan:language
      - run: npm run check:examples
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run demo
      - run: npm run smoke:package

  publish:
    name: Publish to npm
    needs: gate
    runs-on: ubuntu-latest
    # `id-token: write` is what makes this job publishable at all. There is no npm token
    # anywhere in this workflow: the package is configured on npmjs.com with a Trusted
    # Publisher naming this repository, this workflow FILE, and the environment below, and
    # npm exchanges the OIDC token minted by this permission for a short-lived publish
    # credential. Nothing long-lived exists to leak, expire, or rotate. The same permission
    # is what lets npm attach the provenance attestation.
    permissions:
      contents: read
      id-token: write
    # Load-bearing twice over. It is the reviewer gate -- a required reviewer on this
    # environment means no push of a tag reaches the registry unattended. It is ALSO part of
    # the Trusted Publisher's identity: the npmjs.com configuration names this exact
    # environment, so an OIDC token minted for any other environment is refused. Renaming it
    # here without renaming it there breaks publishing rather than weakening it, which is the
    # correct direction for a mistake to fail in.
    environment: npm-publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # dist/ is gitignored and `files` ships it, so publishing without this step would
      # upload a tarball whose `main`/`bin`/`types` all point at paths that do not exist.
      - run: npm run build
      # No `--provenance`: trusted publishing generates and publishes the attestation on its
      # own, and no `NODE_AUTH_TOKEN`, because there is no token. If the Trusted Publisher
      # configuration on npmjs.com ever stops matching this repository, this file's name, or
      # the environment above, this step fails with an authentication error -- it does not
      # fall back to publishing something unattested.
      - run: npm publish --access public
