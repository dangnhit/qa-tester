name: Release

# Tag-driven, never push-driven. A publish is an irreversible act against a public
# registry, so the trigger is an annotated tag a human created deliberately, and the
# whole quality gate runs AGAIN here rather than trusting that CI was green on the
# commit the tag happens to point at -- a tag can be moved onto any commit, including
# one CI never saw.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    name: Full gate on the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The tag and package.json must agree BEFORE anything is built. `npm publish`
      # reads package.json and ignores the tag entirely, so a v1.0.1 tag on a 1.0.0
      # package.json would publish 1.0.0 a second time (a hard registry refusal, if
      # you are lucky) or publish the wrong version under the right-looking tag.
      - name: Tag matches the version being published
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi
      - run: npm run generate:types
      - run: npm run check:generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run scan:secrets
      - run: npm run scan:language
      - run: npm run check:examples
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run demo
      - run: npm run smoke:package

  publish:
    name: Publish to npm
    needs: gate
    runs-on: ubuntu-latest
    # `id-token: write` is what lets npm attach a provenance attestation binding the
    # published tarball to this workflow run and this commit. Without it, `--provenance`
    # fails rather than silently publishing an unattested package.
    permissions:
      contents: read
      id-token: write
    # Point this at a GitHub Environment holding NPM_TOKEN and require a reviewer on it,
    # so no single push to a tag can reach the registry unattended.
    environment: npm-publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # dist/ is gitignored and `files` ships it, so publishing without this step would
      # upload a tarball whose `main`/`bin`/`types` all point at paths that do not exist.
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
