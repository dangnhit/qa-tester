name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Ubuntu Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run generate:types
      - run: npm run check:generated
      - run: npm run typecheck
      - run: npm run lint
      - name: Shipped examples satisfy the current contracts
        run: npm run check:examples
      - name: Full test suite with coverage floor
        run: npm run test:coverage
      - run: npm run build
      - name: Pack and install in a clean typed consumer
        if: matrix.node == 24
        timeout-minutes: 5
        run: npm run smoke:package

  windows:
    name: Windows Node 24
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tests/cli now launches a real Chromium: Phase 8b's six-mode CLI tests and the two-lane
      # flow drive `workflow run` end to end, and this job's selection includes tests/cli. Without
      # this step they fail with "Executable doesn't exist", which is what turned this job red the
      # first time they ran here. No --with-deps: that flag installs Linux system libraries and is
      # a no-op cost on windows-latest.
      - run: npx playwright install chromium
      # ONE FILE from tests/operations, not the directory. This job exists to MEASURE what a
      # POSIX-shaped guard does on NTFS, and export-projection.test.ts is the only file anywhere in
      # tests/ that asserts on `nlink` — so it is the whole reason tests/operations is named here at
      # all. The rest of the directory buys nothing this job needs and costs it three suites that
      # each `chromium.launch()` (awaiting-human-input, observed-execution-pause,
      # observed-execution-residual), one of which drives a Playwright runner subprocess. A red from
      # a launch failure or a hang is not an answer about `nlink`, and an unexplained red is worse
      # than no measurement. The Ubuntu job runs the full suite, so nothing dropped here is unrun.
      #
      # The step is bounded because a hang, unlike a failure, reports nothing at all. The bound is a
      # safety net well above the honest runtime, not a performance budget.
      - name: Unit, path, init, and installer lifecycle tests
        timeout-minutes: 20
        run: npm test -- tests/core tests/contracts tests/cli tests/installer tests/operations/export-projection.test.ts
      - run: npm run build

  browser-demo:
    name: Chromium integration and expected-failure demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser integration tests
        run: npm test -- tests/browser tests/evidence/collector.integration.test.ts tests/evidence/annotator.test.ts tests/orchestration/runtime-public.e2e.test.ts tests/e2e/demo.test.ts
      - name: Expected-failure demo succeeds when the defect is detected
        run: npm run demo

  secret-scan:
    name: Deterministic secret and ignore scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run scan:secrets
